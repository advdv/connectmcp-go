version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/advdv/connectmcp-go/pkg/testdata/gen/go
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
    # The vendored annotations proto must keep its real go_package
    # (pkg/connectmcpv1) so generated testdata code never registers a second
    # copy of connectmcp/v1/annotations.proto; its Go output is deleted after
    # generation (see justfile).
    - file_option: go_package
      path: connectmcp/v1/annotations.proto
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.11
    out: ./gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.2
    out: ./gen/go
    opt:
    - paths=source_relative
