name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up tools (versions from mise.toml)
      uses: jdx/mise-action@v5
      with:
        install_args: go golangci-lint

    - name: Lint
      run: golangci-lint run --max-issues-per-linter 0 --max-same-issues 0

  buf:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up tools (versions from mise.toml)
      uses: jdx/mise-action@v5
      with:
        install_args: buf

    - name: Lint annotation proto
      run: buf lint proto

    - name: Check annotation proto for breaking changes
      if: github.event_name == 'pull_request'
      run: buf breaking proto --against ".git#branch=origin/${{ github.base_ref }},subdir=proto"

    # Publishes connectmcp/v1/annotations.proto as buf.build/advdv/connectmcp,
    # labeled only with the Git SHA so consumers can pin unreleased commits
    # (matching the pseudo-version in their go.mod). Because an explicit
    # --label is given, the BSR default label ("main") is NOT moved: only
    # release.yml moves it, so an unqualified dependency resolves to the
    # latest release. Pushing unchanged content is a no-op on the BSR.
    - name: Push to Buf Schema Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      run: |
        if [ -z "$BUF_TOKEN" ]; then
          echo "::warning::BUF_TOKEN not set, skipping BSR push"
          exit 0
        fi
        buf push proto \
          --label "${{ github.sha }}" \
          --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.19.1
      with:
        bazelisk-cache: true
        disk-cache: ${{ github.ref }}
        repository-cache: true

    - name: Build and test
      run: bazelisk test //... --test_summary=detailed

    - name: Conformance and integration tests
      if: >-
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork)
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      run: |
        if [ -z "$OPENAI_API_KEY" ]; then
          echo "::warning::API key secrets not available, skipping conformance tests"
          exit 0
        fi
        bazelisk test //... \
          --test_env=GOOGLE_API_KEY --test_env=OPENAI_API_KEY --test_env=ANTHROPIC_API_KEY \
          --test_output=all --test_summary=detailed
