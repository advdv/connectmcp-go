name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ''
          - goos: linux
            goarch: arm64
            suffix: ''
          - goos: darwin
            goarch: amd64
            suffix: ''
          - goos: darwin
            goarch: arm64
            suffix: ''
          - goos: windows
            goarch: amd64
            suffix: '.exe'
          - goos: windows
            goarch: arm64
            suffix: '.exe'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go (version from mise.toml)
      uses: jdx/mise-action@v5
      with:
        install_args: go

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        output="protoc-gen-go-mcp-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
        go build -ldflags="-s -w" -o "$output" ./cmd/protoc-gen-go-mcp
        
        # Create archive
        if [ "${{ matrix.goos }}" = "windows" ]; then
          zip "${output%.exe}.zip" "$output"
        else
          tar czf "${output}.tar.gz" "$output"
        fi

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: protoc-gen-go-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
        path: |
          protoc-gen-go-mcp-*
          !protoc-gen-go-mcp-*.tar.gz
          !protoc-gen-go-mcp-*.zip

  # Publishes mcp/v1/annotations.proto to buf.build/advdv/protoc-gen-go-mcp
  # labeled with the release tag (e.g. v1.2.3), so consumers can pin
  # buf.build/advdv/protoc-gen-go-mcp:v1.2.3 alongside the matching Go module
  # version. It also moves the default label "main" to this release, so an
  # unqualified dependency resolves to the latest release (test.yml pushes
  # main-branch commits under their SHA label only).
  bsr:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up tools (versions from mise.toml)
      uses: jdx/mise-action@v5
      with:
        install_args: buf

    - name: Push to Buf Schema Registry
      env:
        BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
      run: |
        if [ -z "$BUF_TOKEN" ]; then
          echo "::error::BUF_TOKEN not set, cannot publish release to BSR"
          exit 1
        fi
        buf push proto \
          --label "${{ github.ref_name }}" \
          --label main \
          --label "${{ github.sha }}" \
          --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"

  release:
    needs: [build, bsr]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create checksums
      run: |
        find . -name "protoc-gen-go-mcp-*" -type f -exec sha256sum {} \; > checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          protoc-gen-go-mcp-*/protoc-gen-go-mcp-*
          checksums.txt
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}